<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Past events — Longtable</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <p class="eyebrow">The Great Hall</p>
      <h1>Past events</h1>
      <p>Replay the final saved schedule and attendance for an earlier event.</p>
      <nav class="event-navigation" aria-label="Event navigation"><a href="./">Current event</a></nav>
    </div>
  </header>
  <main class="archive-page">
    <p>Archives appear after privacy finalization. Replays include retained records; deleted games and earlier edits are not reconstructed.</p>
    <p id="archive-status" role="status">Loading past events…</p>
    <button id="archive-retry" type="button" hidden>Try again</button>
    <ul id="archive-list" class="archive-list" aria-label="Past events"></ul>
  </main>
  <script type="module" src="./past-events.mjs"></script>
</body>
</html>
